name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  ZLIB_VER: "1.3.1"
  EXPAT_VER: "2.6.3"
  OPENSSL_VER: "3.0.15"
  CURL_VER: "8.10.1"
  GIT_VER: "2.46.1"
  ANDROID_API: "26"
  VERSION_NAME: "1.0"
  VERSION_CODE: "1"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 定位 NDK
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -d "$SDK/ndk" ] && [ -n "$(ls -A "$SDK/ndk" 2>/dev/null)" ]; then
            NDK="$(ls -d "$SDK"/ndk/* | sort -V | tail -1)"
          else
            curl -fsSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
            unzip -q /tmp/ndk.zip -d /tmp/ndkdir
            NDK="$(ls -d /tmp/ndkdir/*)"
          fi
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "使用 NDK: $NDK"
          ls "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" | grep -E "aarch64-linux-android26-clang$"

      - name: 缓存原生依赖
        uses: actions/cache@v4
        with:
          path: |
            build/prefix
            build/src/*.tar.gz
          key: gitdroid-deps-${{ env.OPENSSL_VER }}-${{ env.CURL_VER }}-${{ env.EXPAT_VER }}-${{ env.ZLIB_VER }}-1

      - name: 交叉编译依赖（zlib/expat/OpenSSL/libcurl）
        run: bash ci/build-deps.sh

      - name: 交叉编译 Git
        run: bash ci/build-git.sh

      - name: 打包 APK
        run: bash ci/package-apk.sh

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitDroid-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gitdroid-latest
          name: GitDroid 最新构建
          body: |
            原生 aarch64 Git（交叉编译）＋极简控制台外壳。
            minSdk 26 / targetSdk 28，固定签名密钥，可直接覆盖安装。
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
